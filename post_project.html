<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایجاد پروژه جدید - سایت فریلنسری</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="frontend/css/style.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800">
    <header class="bg-blue-600 text-white p-4 shadow-lg">
        <nav class="container mx-auto flex flex-wrap justify-between items-center">
            <a href="index.html" class="text-2xl font-bold hover:text-blue-200 transition-colors">سایت فریلنسری</a>
            <div class="space-x-reverse space-x-2">
                <a href="dashboard.html" class="hover:text-blue-200 px-3 py-2 rounded-md text-sm font-medium">داشبورد</a>
                <a href="browse_projects.html" class="hover:text-blue-200 px-3 py-2 rounded-md text-sm font-medium">مرور پروژه ها</a>
                <button id="logoutButton" class="btn btn-danger px-3 py-1 text-sm">خروج</button>
            </div>
        </nav>
    </header>

    <main class="container mx-auto p-4 sm:p-6 mt-6">
        <div class="bg-white p-6 md:p-8 rounded-xl shadow-xl w-full max-w-3xl mx-auto">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-semibold text-gray-700">ثبت پروژه جدید</h2>
                <p class="text-gray-500">اطلاعات پروژه خود را با دقت وارد کنید.</p>
            </div>

            <div id="message-area" class="mb-6"></div>

            <form id="postProjectForm" method="POST" class="space-y-6">
                <div>
                    <label for="project_title">عنوان پروژه</label>
                    <input type="text" id="project_title" name="project_title" required>
                    <p id="project_title_error" class="form-error-text"></p>
                </div>

                <div>
                    <label for="project_description">توضیحات کامل پروژه</label>
                    <textarea id="project_description" name="project_description" rows="6" required></textarea>
                    <p id="project_description_error" class="form-error-text"></p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="project_budget">بودجه (تومان)</label>
                        <input type="number" id="project_budget" name="project_budget" placeholder="مثال: 500000">
                        <p id="project_budget_error" class="form-error-text"></p>
                    </div>
                    <div>
                        <label for="project_deadline">مهلت انجام (اختیاری)</label>
                        <input type="date" id="project_deadline" name="project_deadline">
                        <p id="project_deadline_error" class="form-error-text"></p>
                    </div>
                </div>

                <div>
                    <label for="project_tags">مهارت های مورد نیاز (جدا شده با ویرگول)</label>
                    <input type="text" id="project_tags" name="project_tags" placeholder="مثال: PHP, JavaScript, طراحی وب">
                    <p class="text-xs text-gray-500 mt-1">این به فریلنسرها کمک می‌کند پروژه شما را راحت‌تر پیدا کنند.</p>
                    <p id="project_tags_error" class="form-error-text"></p>
                </div>

                <div>
                    <button type="submit"
                            class="w-full btn btn-success py-3 text-base font-semibold flex justify-center items-center">
                        ثبت پروژه
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2023 تمامی حقوق محفوظ است. طراحی شده توسط Jules.</p>
    </footer>

    <script src="frontend/js/auth_ui.js"></script>
    <script src="frontend/js/post_project.js"></script>
</body>
</html>
