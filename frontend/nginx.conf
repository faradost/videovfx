# frontend/nginx.conf
server {
    listen 80;
    server_name localhost; # Or your domain name

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve React App
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend Django application
    # Assumes the backend is running on a service named 'backend' (e.g., in docker-compose)
    # on port 8000.
    location /api/ {
        proxy_pass http://backend:8000/api/; # Note the trailing slash if /api/ on backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Add locations for static files and media files if served by Django/Nginx directly
    # location /static/ {
    #     alias /path/to/your/django/staticfiles/;
    # }
    # location /media/ {
    //     alias /path/to/your/django/mediafiles/;
    // }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html; # Or a custom error page directory
    }
}
