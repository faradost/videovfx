<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - سایت فریلنسری</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="frontend/css/style.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <a href="index.html" class="text-2xl font-bold text-blue-600 hover:text-blue-700 transition-colors">سایت فریلنسری</a>
            <h2 class="text-3xl font-semibold text-gray-700 mt-2">ورود به حساب کاربری</h2>
        </div>

        <div id="message-area" class="mb-4"></div>

        <form id="loginForm" method="POST" class="space-y-6">
            <div>
                <label for="identifier" class="block text-sm font-medium text-gray-700 mb-1">نام کاربری یا ایمیل</label>
                <input type="text" id="identifier" name="identifier" required
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-all">
                <p id="identifier_error" class="form-error-text"></p>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">رمز عبور</label>
                <input type="password" id="password" name="password" required
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-all">
                <p id="password_error" class="form-error-text"></p>
            </div>

            <!-- Placeholder for CSRF token -->
            <!-- <input type="hidden" name="csrf_token" value="your_csrf_token_here"> -->

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember_me" name="remember_me" type="checkbox"
                           class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded transition-all">
                    <label for="remember_me" class="mr-2 block text-sm text-gray-900">
                        مرا به خاطر بسپار
                    </label>
                </div>

                <div class="text-sm">
                    <a href="#" class="font-medium text-blue-600 hover:text-blue-500 hover:underline">
                        رمز عبور خود را فراموش کرده‌اید؟
                    </a>
                </div>
            </div>

            <div>
                <button type="submit"
                        class="w-full btn btn-primary py-3 text-base font-semibold flex justify-center items-center">
                    ورود
                </button>
            </div>
        </form>

        <div class="mt-8 text-center">
            <p class="text-sm text-gray-600">
                هنوز حساب کاربری ندارید؟
                <a href="register.html" class="font-medium text-blue-600 hover:text-blue-500 hover:underline">
                    ثبت نام کنید
                </a>
            </p>
            <p class="mt-2 text-sm text-gray-600">
                <a href="index.html" class="text-gray-500 hover:text-gray-700 hover:underline">
                    بازگشت به صفحه اصلی
                </a>
            </p>
        </div>
    </div>

    <script src="frontend/js/login.js"></script>
</body>
</html>
